name: Flutter Production Build (Web + Android + iOS)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]


jobs:
  test_and_android_web_build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.4'

      - run: flutter config --enable-web
      - run: flutter pub get

      # ✅ 1. Run Tests
      - name: Run Tests
        run: flutter test

      # ✅ 2. Build Android (Release)
      - name: Build Android APK
        run: flutter build apk --release

      # ✅ 3. Build Web (Production)
      - name: Build Web
        run: flutter build web --release --base-href=/hosting_with_git/

      # ✅ 4. Deploy Web to Production GitHub Pages
      - name: Deploy to Production (Web)
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: build/web
          publish_branch: gh-pages
          force_orphan: true
          user_name: "github-actions[bot]"
          user_email: "github-actions[bot]@users.noreply.github.com"

      # ✅ 5. Upload Android APK (optional)
      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release.apk
          path: build/app/outputs/flutter-apk/app-release.apk

  ios_build:
    runs-on: macos-latest
    needs: test_and_android_web_build  # Wait until tests + web/android done

    steps:
      - uses: actions/checkout@v3

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.4'

      - run: flutter pub get

      # ✅ 6. Build iOS (Release, no signing)
      - name: Build iOS
        run: flutter build ios --release --no-codesign

      # ✅ 7. Upload iOS build
      - name: Upload iOS build
        uses: actions/upload-artifact@v4
        with:
          name: ios-release-app
          path: build/ios/iphoneos/*.app
